<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Web Proxy</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<header class="toolbar">

    <div class="logo">
        WEB PROXY
    </div>

    <button
        class="nav-button"
        onclick="history.back()"
        title="Back"
    >
        ←
    </button>

    <button
        class="nav-button"
        onclick="history.forward()"
        title="Forward"
    >
        →
    </button>

    <button
        class="nav-button"
        onclick="location.reload()"
        title="Reload"
    >
        ↻
    </button>

    <form
        class="address-form"
        action="/proxy"
        method="get"
    >

        <input
            name="url"
            type="text"
            placeholder="Enter a website..."
            autocomplete="off"
            spellcheck="false"
            required
        >

        <button
            class="go-button"
            type="submit"
        >
            GO
        </button>

    </form>

</header>


<main class="home">

    <div class="card">

        <div class="globe">
            🌐
        </div>

        <h1>
            Web Proxy
        </h1>

        <p>
            Enter a website above to browse it through
            this site.
        </p>

        <p class="small">
            Example: example.com
        </p>

    </div>

</main>

</body>
</html>
