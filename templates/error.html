<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Proxy Error</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<header class="toolbar">

    <div class="logo">
        WEB PROXY
    </div>

    <a
        class="home-button"
        href="/"
    >
        HOME
    </a>

</header>


<main class="error-page">

    <div class="error-card">

        <div class="error-icon">
            ⚠
        </div>

        <h1>
            Proxy Error
        </h1>

        <p>
            {{ message }}
        </p>

        <a
            class="back-button"
            href="/"
        >
            Back to Proxy
        </a>

    </div>

</main>

</body>
</html>
